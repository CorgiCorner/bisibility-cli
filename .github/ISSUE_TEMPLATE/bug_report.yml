name: Bug report
description: Report a reproducible problem with the Bisibility CLI
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Do not include credentials or customer data. Report security issues
        privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `bisibility --version`.
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and operating system
      description: Node.js version and operating system.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence with secrets removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Sanitized logs, screenshots, or related links.
